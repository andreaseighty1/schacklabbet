name: Kontrollera och publicera Schacklabbet
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run prepare:multiplayer && git diff --exit-code -- supabase/dashboard
      - run: npx tsc --strict --noEmit --allowImportingTsExtensions --moduleResolution bundler --module esnext --target es2022 --lib es2022,dom --skipLibCheck supabase/functions/chess-room/index.ts
      - run: npm test
      - run: npm run test:engine
      - run: node scripts/calibrate-opponents.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=list,github
        env:
          VITE_SUPABASE_URL: https://ixioaisppcqqutufpuct.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MBLGx8pfeYKa0qHqmgcNMA_jCKjnHgj
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}
          VITE_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN || 'schacklabbet.42improbableowls.com' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ixioaisppcqqutufpuct.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_MBLGx8pfeYKa0qHqmgcNMA_jCKjnHgj' }}
      - run: npm run check:dist
        env:
          VITE_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
